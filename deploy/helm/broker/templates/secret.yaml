{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
# Rendered from values.yaml / --set-string overrides. The defaults here are
# obvious placeholders; override them (preferably via --set-string on
# `helm install`/`helm upgrade`, not by committing real secrets into values
# files) or set secrets.create=false and secrets.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "broker.secretName" . }}
  namespace: {{ include "broker.namespace" . }}
  labels:
    {{- include "broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  BROKER_TOKEN: {{ .Values.secrets.adminToken | quote }}
  {{- if .Values.secrets.readToken }}
  BROKER_READ_TOKEN: {{ .Values.secrets.readToken | quote }}
  {{- end }}
  {{- if .Values.secrets.workerToken }}
  BROKER_WORKER_TOKEN: {{ .Values.secrets.workerToken | quote }}
  {{- end }}
  {{- if .Values.secrets.publisherToken }}
  BROKER_PUBLISHER_TOKEN: {{ .Values.secrets.publisherToken | quote }}
  {{- end }}
  {{- if .Values.secrets.frameSigningKey }}
  BROKER_FRAME_SIGNING_KEY: {{ .Values.secrets.frameSigningKey | quote }}
  {{- end }}
  {{- if .Values.secrets.frameEncryptionKey }}
  BROKER_FRAME_ENCRYPTION_KEY: {{ .Values.secrets.frameEncryptionKey | quote }}
  {{- end }}
  {{- if .Values.broker.listeners.amqp.enabled }}
  BROKER_AMQP_USERNAME: {{ .Values.secrets.amqpUsername | quote }}
  BROKER_AMQP_PASSWORD: {{ .Values.secrets.amqpPassword | quote }}
  {{- end }}
  {{- if and .Values.tls.enabled (not .Values.tls.existingSecret) }}
  # PLACEHOLDER — not a valid certificate/key. Supply real PEM material via
  # --set-file tls.crt=... --set-file tls.key=... or, better, point
  # tls.existingSecret at a secret managed outside this chart.
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_REAL_PRIVATE_KEY
    -----END PRIVATE KEY-----
  {{- end }}
{{- end }}
