# Default values for the broker chart.
# This chart is new/unvalidated tooling — read deploy/README.md before using
# it anywhere that matters. Distributed/clustered mode in the underlying
# brokerd binary is experimental and not production-safe (project Tasks.md).
# With cluster disabled, replicaCount > 1 runs independent standalone brokers.
# Clustered wiring is opt-in; see deploy/README.md before enabling it.

replicaCount: 3

image:
  repository: ghcr.io/oarkflow/broker
  tag: "latest" # TODO: pin to a real, signed tag or digest before using this
  digest: "" # Clustered mode requires sha256:<64 lowercase hex characters>.
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

namespace:
  # Set to false if the namespace is managed outside this chart.
  create: true
  name: broker

serviceAccount:
  create: true
  name: ""
  automount: false

podAnnotations: {}
podLabels: {}

# Pod-level security context. The brokerd image runs as a fixed non-root
# UID/GID (65532) baked into the distroless image (see root Dockerfile).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

# -- brokerd configuration --
broker:
  profile: durable # durable | latency | throughput | lightweight
  defaultQueue: default
  maxBodyBytes: 1048576
  insecureDev: false # NEVER set true outside isolated dev; main.go disables auth entirely
  quiet: false

  store:
    kind: wal # memory | wal | sqlite
    walFormat: binary
    walShards: 1
    walSegmentSize: 67108864
    walMaxSegments: 10

  listeners:
    httpAddr: ":8090"
    grpc:
      enabled: true
      addr: ":50051"
    mqtt:
      enabled: true
      addr: ":1883"
    amqp:
      enabled: true
      addr: ":5672"
    # Native BST1 supports token or mapped mTLS authentication. Production
    # requires TLS plus an ACL credential. Enabling it adds the listener to
    # both Services. With networkPolicy.enabled=true, ingress remains denied
    # until networkPolicy.nativeIngressFrom explicitly allows client sources.
    native:
      enabled: false
      addr: ":8091"

  # Extra environment variables/passthrough, e.g. BROKER_OTLP_ENDPOINT.
  extraEnv: []
  # - name: BROKER_OTLP_ENDPOINT
  #   value: "http://otel-collector.observability:4318"
  extraEnvFrom: []

# -- optional etcd/raft cluster wiring. This bootstraps a fixed-size initial
# cluster from the StatefulSet peer map; scaling requires the documented Raft
# membership workflow and must not be done by changing replicaCount alone.
cluster:
  enabled: false
  peerPort: 7946
  clusterDomain: cluster.local
  replicationFactor: 3
  minISR: 0 # 0 selects the majority
  maxReplicationLag: 1000
  replicationTimeout: 5s
  reconcileInterval: 5s
  autoReassignInterval: 0s # set above zero to replace unavailable replicas and balance healthy replicas by count/workload/disk
  readIndexTimeout: 5s

# -- secrets --
# By default the chart creates a placeholder Secret you MUST overwrite
# (values below are rejected as obviously-fake unless you override them).
# Prefer `secrets.create: false` plus an externally managed Secret named
# `secrets.existingSecret` (sealed-secrets, external-secrets, SOPS, etc).
secrets:
  create: true
  existingSecret: ""
  adminToken: "REPLACE_ME_ADMIN_TOKEN"
  readToken: ""
  workerToken: ""
  publisherToken: ""
  frameSigningKey: ""
  frameEncryptionKey: ""
  amqpUsername: "REPLACE_ME_AMQP_USERNAME"
  amqpPassword: "REPLACE_ME_AMQP_PASSWORD"

# -- TLS --
# docs/OPERATIONS.md requires TLS or mTLS in any non-isolated-dev
# environment; main.go also refuses to start in production mode (insecureDev
# false) without -tls-cert/-tls-key.
tls:
  enabled: true
  # Existing secret containing tls.crt / tls.key / (optional) ca.crt.
  # If empty and tls.enabled is true, the chart creates `secrets.create`'s
  # secret with placeholder PEM content that WILL fail TLS handshake and
  # must be replaced before real use.
  existingSecret: ""
  requireClientCert: false

persistence:
  enabled: true
  size: 20Gi
  storageClassName: "" # empty = cluster default StorageClass
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

service:
  type: ClusterIP
  ports:
    httpAdmin: 8090
    grpc: 50051
    mqtt: 1883
    amqp: 5672
    native: 8091

terminationGracePeriodSeconds: 30

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  startup:
    path: /healthz
    periodSeconds: 5
    failureThreshold: 30

podDisruptionBudget:
  enabled: true
  # Must stay below ceil(replicaCount/2) so a voluntary disruption can never
  # remove a quorum majority. The default (1) is sized for replicaCount: 3.
  maxUnavailable: 1

networkPolicy:
  enabled: true
  # NetworkPolicyPeer entries allowed to connect to BST1 when its listener is
  # enabled. Empty keeps port 8091 blocked by this policy.
  nativeIngressFrom: []

topologySpreadConstraints:
  enabled: true
  maxSkew: 1
  topologyKey: kubernetes.io/hostname

nodeSelector: {}
tolerations: []
affinity: {}
