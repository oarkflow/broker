# TEMPLATE ONLY. Every value below is a placeholder and MUST be replaced
# before this manifest is applied to any real cluster.
#
# Preferred approach: do NOT edit/commit this file with real values. Instead
# create the secret imperatively, e.g.:
#
#   kubectl create secret generic broker-secrets -n broker \
#     --from-literal=BROKER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=BROKER_READ_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=BROKER_WORKER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=BROKER_PUBLISHER_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=BROKER_FRAME_SIGNING_KEY="$(openssl rand -hex 32)" \
#     --from-literal=BROKER_FRAME_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-file=tls.crt=server.crt \
#     --from-file=tls.key=server.key \
#     --from-file=ca.crt=ca.crt
#
# or manage it with sealed-secrets / external-secrets / SOPS in production.
# BROKER_TOKEN is required by cmd/brokerd/main.go unless --insecure-dev is
# set (never do that outside an isolated dev box, per docs/OPERATIONS.md).
apiVersion: v1
kind: Secret
metadata:
  name: broker-secrets
  namespace: broker
  labels:
    app.kubernetes.io/name: broker
type: Opaque
stringData:
  BROKER_TOKEN: "REPLACE_ME_ADMIN_TOKEN"
  BROKER_READ_TOKEN: "REPLACE_ME_READ_TOKEN"
  BROKER_WORKER_TOKEN: "REPLACE_ME_WORKER_TOKEN"
  BROKER_PUBLISHER_TOKEN: "REPLACE_ME_PUBLISHER_TOKEN"
  BROKER_FRAME_SIGNING_KEY: "REPLACE_ME_HEX_HMAC_KEY"
  BROKER_FRAME_ENCRYPTION_KEY: "REPLACE_ME_HEX_AES_KEY"
  # AMQP PLAIN credentials; required in production mode unless mTLS is used
  # (see main.go: amqpAddr != "" && !insecureDev requires username/password
  # or --require-client-cert).
  BROKER_AMQP_USERNAME: "REPLACE_ME_AMQP_USER"
  BROKER_AMQP_PASSWORD: "REPLACE_ME_AMQP_PASSWORD"
  # TLS material. PLACEHOLDER PEM blocks below are NOT valid certificates;
  # they exist only so this file documents the expected keys. Replace with
  # real PEM content (or, better, don't commit this file at all).
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_CERTIFICATE
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_REAL_PRIVATE_KEY
    -----END PRIVATE KEY-----
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_WITH_REAL_CLIENT_CA_CERTIFICATE
    -----END CERTIFICATE-----
