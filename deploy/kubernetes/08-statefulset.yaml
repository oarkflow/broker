# StatefulSet, not Deployment: each replica needs a stable network identity
# (broker-0, broker-1, broker-2 via the headless service) and its own
# persistent WAL volume. docs/OPERATIONS.md: "Distributed nodes require
# distinct durable WALDir paths ... Do not share a writable data directory
# between nodes" -- separate VolumeClaimTemplate instances per pod satisfy
# that even though brokerd itself does not yet coordinate across replicas
# (see deploy/README.md).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: broker
  namespace: broker
  labels:
    app.kubernetes.io/name: broker
spec:
  serviceName: broker-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: broker
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: broker
    spec:
      serviceAccountName: broker
      automountServiceAccountToken: false
      # Per docs/OPERATIONS.md rolling-upgrade runbook: drain/upgrade one
      # node at a time and let it rejoin and catch up before continuing.
      # 30s gives the in-process 15s shutdown timeout (cmd/brokerd/main.go)
      # headroom plus time for in-flight requests to drain behind the
      # preStop hook below.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: broker
      containers:
        - name: brokerd
          image: ghcr.io/oarkflow/broker:latest # TODO: pin to a real tag/digest
          imagePullPolicy: IfNotPresent
          command: ["/brokerd"]
          args:
            - -tls-cert=/etc/broker/tls/tls.crt
            - -tls-key=/etc/broker/tls/tls.key
          ports:
            - name: http-admin
              containerPort: 8090
            - name: grpc
              containerPort: 50051
            - name: mqtt
              containerPort: 1883
            - name: amqp
              containerPort: 5672
          envFrom:
            - configMapRef:
                name: broker-config
            - secretRef:
                name: broker-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Probes hit the admin HTTP listener's unauthenticated /healthz and
          # /readyz endpoints (admin.go). Scheme is HTTPS because this
          # manifest enables TLS by default -- see deploy/README.md if you
          # terminate TLS at a mesh/proxy instead and want plain HTTP here.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-admin
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-admin
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http-admin
              scheme: HTTPS
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                # Give in-flight connections/load balancer deregistration a
                # moment before SIGTERM triggers brokerd's shutdown path.
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /etc/broker/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tls
          secret:
            secretName: broker-secrets
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: broker
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: "" # set to your storage class; omitted = cluster default
        resources:
          requests:
            storage: 20Gi
