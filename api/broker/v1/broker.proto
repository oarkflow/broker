syntax = "proto3";

package broker.v1;

option go_package = "github.com/oarkflow/broker/api/broker/v1;brokerv1";

service BrokerService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc Poll(PollRequest) returns (PollResponse);
  rpc Ack(AckRequest) returns (AckResponse);
  rpc Nack(NackRequest) returns (AckResponse);
  rpc ReadStream(ReadStreamRequest) returns (ReadStreamResponse);
  rpc CommitOffset(CommitOffsetRequest) returns (AckResponse);
}

message HealthRequest {}
message HealthResponse {
  string status = 1;
  string version = 2;
}

message PublishRequest {
  string topic = 1;
  string queue = 2;
  string stream = 3;
  bytes payload = 4;
  map<string, string> headers = 5;
  string tenant_id = 6;
  string idempotency_key = 7;
  string producer_id = 8;
}

message PublishResponse {
  string message_id = 1;
  string acknowledgement = 2;
  int32 partition = 3;
  uint64 offset = 4;
  uint64 leader_epoch = 5;
  int32 replication_count = 6;
  string durability = 7;
}

message BrokerMessage {
  string id = 1;
  string topic = 2;
  string queue = 3;
  string stream = 4;
  int32 partition = 5;
  uint64 offset = 6;
  bytes payload = 7;
  map<string, string> headers = 8;
  string tenant_id = 9;
  string lease_token = 10;
  int32 attempts = 11;
}

message PollRequest {
  string queue = 1;
  string consumer_id = 2;
  string consumer_group = 3;
  int32 limit = 4;
  int64 visibility_timeout_millis = 5;
  string tenant_id = 6;
}
message PollResponse { repeated BrokerMessage messages = 1; }

message AckRequest {
  string message_id = 1;
  string queue = 2;
  string lease_token = 3;
  string consumer_id = 4;
}

message NackRequest {
  string message_id = 1;
  string queue = 2;
  string lease_token = 3;
  string consumer_id = 4;
  string action = 5;
  string reason = 6;
  string error = 7;
  int64 delay_millis = 8;
  string dlq = 9;
}

message ReadStreamRequest {
  string stream = 1;
  string consumer_group = 2;
  uint64 after_offset = 3;
  int32 limit = 4;
  string tenant_id = 5;
}
message ReadStreamResponse { repeated BrokerMessage messages = 1; }

message CommitOffsetRequest {
  string stream = 1;
  string consumer_group = 2;
  uint64 offset = 3;
  string tenant_id = 4;
}

message AckResponse {}
