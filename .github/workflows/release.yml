name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: |
            go.sum
            cmd/go.sum
            contrib/go.sum

      - name: Verify reproducible command builds
        run: bash scripts/reproducible_build.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0

      - name: Install verified Syft
        env:
          SYFT_VERSION: 1.57.2
        run: |
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" --output "$archive"
          curl --fail --silent --show-error --location "$base/syft_${SYFT_VERSION}_checksums.txt" --output checksums.txt
          curl --fail --silent --show-error --location "$base/syft_${SYFT_VERSION}_checksums.txt.sigstore.json" --output checksums.sigstore.json
          cosign verify-blob checksums.txt \
            --bundle checksums.sigstore.json \
            --certificate-identity 'https://github.com/anchore/syft/.github/workflows/release.yaml@refs/heads/main' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          sha256sum --ignore-missing -c checksums.txt
          tar -xzf "$archive" syft
          sudo install -m 0755 syft /usr/local/bin/syft

      - name: Build release binaries (reproducible)
        env:
          CGO_ENABLED: 0
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          mkdir -p dist
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 2
          fi
          TARGETS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for target in "${TARGETS[@]}"; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            echo "Building brokerd for $GOOS/$GOARCH..."
            (cd cmd && GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -buildvcs=false -ldflags "-s -w -buildid= -X main.version=$TAG" -o "../dist/brokerd_${TAG}_${GOOS}_${GOARCH}${EXT}" ./brokerd)

            echo "Building brokerctl for $GOOS/$GOARCH..."
            (cd cmd && GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -buildvcs=false -ldflags "-s -w -buildid= -X main.version=$TAG" -o "../dist/brokerctl_${TAG}_${GOOS}_${GOARCH}${EXT}" ./brokerctl)
          done

          for artifact in dist/*; do
            bash scripts/generate_sbom.sh "$PWD/$artifact" "$PWD/$artifact.sbom.cdx.json"
          done

      - name: Package archives
        run: |
          cd dist
          TAG="${GITHUB_REF_NAME}"
          export TZ=UTC
          for f in *; do
            if [[ "$f" == *.sbom.cdx.json ]]; then
              chmod 0644 "$f"
            else
              chmod 0755 "$f"
            fi
          done
          touch -d "@${SOURCE_DATE_EPOCH}" *
          for f in *; do
            if [[ "$f" == *.sbom.cdx.json ]]; then
              continue
            elif [[ "$f" == *.exe ]]; then
              zip -X -q "${f%.exe}.zip" "$f"
              rm "$f"
            elif [ -f "$f" ]; then
              tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" --owner=0 --group=0 --numeric-owner --mode=0755 -cf - "$f" | gzip -n > "${f}.tar.gz"
              rm "$f"
            fi
          done

      - name: Publish, sign, and attest multi-architecture broker image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          EXPECTED_IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}"
          RUNTIME_BASE="gcr.io/distroless/static-debian13:nonroot@sha256:25ac8f0c3b2334a9eb05452266bd4697864a8c8ef0ef71e5e6480d7f92868329"
          METADATA_FILE="${RUNNER_TEMP}/container-image-metadata.json"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          cosign verify "$RUNTIME_BASE" \
            --certificate-identity 'keyless@distroless.iam.gserviceaccount.com' \
            --certificate-oidc-issuer 'https://accounts.google.com' >/dev/null
          docker buildx build \
            --target brokerd \
            --platform linux/amd64,linux/arm64 \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --provenance=false \
            --sbom=false \
            --push \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:latest" \
            --label "org.opencontainers.image.version=$TAG" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --metadata-file "$METADATA_FILE" \
            .

          DIGEST="$(jq -r '.["containerimage.digest"] // empty' "$METADATA_FILE")"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx returned an invalid image digest: $DIGEST" >&2
            exit 1
          fi
          IMAGE_REF="$IMAGE@$DIGEST"
          printf '%s\n' "$IMAGE_REF" > dist/container-image.txt

          cosign sign --yes "$IMAGE_REF"
          for target in linux/amd64 linux/arm64; do
            arch="${target#*/}"
            sbom="dist/container-${arch}.sbom.cdx.json"
            syft "$IMAGE_REF" --platform "$target" -o cyclonedx-json > "$sbom"
            cosign attest --yes --type cyclonedx --predicate "$sbom" "$IMAGE_REF"
          done

          cosign verify "$IMAGE_REF" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' >/dev/null
          cosign verify-attestation "$IMAGE_REF" \
            --type cyclonedx \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' >/dev/null

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Sign Checksums with Cosign
        run: |
          cd dist
          cosign sign-blob --yes --bundle cosign.bundle checksums.txt

      - name: Verify release assets and signature
        run: |
          cd dist
          sha256sum -c checksums.txt
          cosign verify-blob checksums.txt \
            --bundle cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/oarkflow/broker/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
