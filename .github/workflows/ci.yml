name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          cache-dependency-path: |
            go.sum
            cmd/go.sum
            contrib/go.sum
            examples/go.sum
      - run: bash scripts/ci_all_modules.sh test

  correctness:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: |
            go.sum
            cmd/go.sum
            contrib/go.sum
            examples/go.sum
      - name: Reject machine-specific module replacements
        run: |
          if grep -R -nE '^[[:space:]]*replace .*=>[[:space:]]*(/|[A-Za-z]:\\)' --include=go.mod .; then
            echo 'absolute replace directives are not portable' >&2
            exit 1
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l -- $(git ls-files '*.go'))"
      - run: bash scripts/ci_all_modules.sh vet
      - run: bash scripts/ci_all_modules.sh race
      - name: Codec fuzz smoke tests
        run: bash scripts/fuzz_smoke.sh 15s
      - name: Reproducible command builds
        run: bash scripts/reproducible_build.sh

  vulnerability-scan:
    strategy:
      fail-fast: false
      matrix:
        module: ['.', cmd, contrib, examples]
    runs-on: ubuntu-latest
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: stable
          work-dir: ${{ matrix.module }}
          go-package: ./...
